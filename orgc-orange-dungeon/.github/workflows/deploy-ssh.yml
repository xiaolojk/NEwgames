name: 部署到服务器

# 通过 SSH 自动部署到你的服务器
# 需要在 GitHub 仓库 Settings → Secrets 添加：
#   SSH_HOST     服务器 IP（如 202.189.10.3）
#   SSH_PORT     SSH 端口（如 30022）
#   SSH_USER     用户名（如 root）
#   SSH_PASSWORD 密码

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH 部署到服务器
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖并构建
        run: |
          npm ci || npm install
          npm run build
          touch dist/.nojekyll

      - name: 打包产物
        run: tar -czf dungeon.tar.gz -C dist .

      - name: 上传到服务器并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== 接收文件 ==="
            mkdir -p /var/www/orange-dungeon

      - name: 通过 scp 上传产物
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dungeon.tar.gz"
          target: "/tmp/"

      - name: 解压并配置 Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "=== 解压到 Web 目录 ==="
            rm -rf /var/www/orange-dungeon/*
            tar -xzf /tmp/dungeon.tar.gz -C /var/www/orange-dungeon
            rm -f /tmp/dungeon.tar.gz
            chmod -R 755 /var/www/orange-dungeon

            echo "=== 安装 Nginx（如未安装）==="
            if ! command -v nginx &> /dev/null; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
            fi

            echo "=== 写入 Nginx 配置 ==="
            cat > /etc/nginx/sites-available/orange-dungeon <<'NGINX_EOF'
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/orange-dungeon;
    index index.html;

    # 游戏主页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
NGINX_EOF

            echo "=== 启用站点 ==="
            ln -sf /etc/nginx/sites-available/orange-dungeon /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default

            echo "=== 测试 Nginx 配置 ==="
            nginx -t

            echo "=== 重启 Nginx ==="
            systemctl restart nginx
            systemctl enable nginx

            echo "=== 开放防火墙 ==="
            ufw allow 80/tcp 2>/dev/null || true
            ufw allow 443/tcp 2>/dev/null || true
            ufw allow 30022/tcp 2>/dev/null || true

            echo "=== 部署完成 ==="
            echo "访问地址: http://$(curl -s ifconfig.me 2>/dev/null || echo '服务器IP')"
            echo "Web 根目录: /var/www/orange-dungeon"
            ls -la /var/www/orange-dungeon/
