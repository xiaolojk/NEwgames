name: 构建并发布 Release

# 自动构建网页版并发布到 GitHub Release
# 服务器端通过 deploy.sh 一键拉取部署，无需 SSH secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci || npm install

      - name: 构建
        run: |
          npm run build
          touch dist/.nojekyll

      - name: 打包产物
        run: tar -czf dungeon-deploy.tar.gz -C dist .

      - name: 删除旧 Release
        continue-on-error: true
        run: gh release delete v1.0.0 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建新 Release
        run: |
          gh release create v1.0.0 \
            dungeon-deploy.tar.gz \
            deploy.sh \
            --title "橘子地牢 v1.0.0" \
            --notes "橘子地牢 Roguelike 网页版

          ## 服务器部署
          在服务器执行一行命令即可：
          \`\`\`bash
          curl -fsSL https://github.com/xiaolojk/NEwgames/releases/download/v1.0.0/deploy.sh | bash
          \`\`\`

          ## 手机端
          横屏游玩，触屏控制会自动启用（虚拟摇杆 + 攻击/冲刺/药水按钮）

          Orgc 橘子工作室"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
