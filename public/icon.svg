<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#B0E0E6"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- 太阳 -->
  <circle cx="410" cy="96" r="44" fill="url(#sun)"/>
  <g stroke="#FFB300" stroke-width="6" stroke-linecap="round">
    <line x1="410" y1="26" x2="410" y2="10"/>
    <line x1="410" y1="166" x2="410" y2="182"/>
    <line x1="340" y1="96" x2="324" y2="96"/>
    <line x1="480" y1="96" x2="496" y2="96"/>
    <line x1="360" y1="46" x2="348" y2="34"/>
    <line x1="460" y1="146" x2="472" y2="158"/>
    <line x1="360" y1="146" x2="348" y2="158"/>
    <line x1="460" y1="46" x2="472" y2="34"/>
  </g>
  <!-- 土壤 -->
  <rect x="56" y="300" width="400" height="156" rx="16" fill="url(#soil)"/>
  <!-- 农田垄沟 -->
  <g fill="#5D3A1A" opacity="0.4">
    <rect x="56" y="330" width="400" height="4" rx="2"/>
    <rect x="56" y="370" width="400" height="4" rx="2"/>
    <rect x="56" y="410" width="400" height="4" rx="2"/>
  </g>
  <!-- 作物 - 小麦 -->
  <g transform="translate(120,280)">
    <rect x="10" y="40" width="6" height="60" fill="#DAA520"/>
    <ellipse cx="13" cy="30" rx="14" ry="22" fill="#F4D03F"/>
    <ellipse cx="13" cy="28" rx="10" ry="16" fill="#FFE066"/>
  </g>
  <!-- 作物 - 萝卜 -->
  <g transform="translate(230,290)">
    <path d="M 0 40 Q -16 20 -8 0 L 16 0 Q 24 20 8 40 Z" fill="#E74C3C"/>
    <path d="M -4 -6 L -10 -22 L -2 -12 Z" fill="#27AE60"/>
    <path d="M 2 -4 L 6 -22 L 8 -10 Z" fill="#2ECC71"/>
    <path d="M 0 -6 L -2 -26 L 6 -14 Z" fill="#27AE60"/>
  </g>
  <!-- 作物 - 玉米 -->
  <g transform="translate(340,270)">
    <rect x="10" y="60" width="10" height="40" fill="#8B7355"/>
    <ellipse cx="15" cy="45" rx="16" ry="30" fill="#FFD700"/>
    <ellipse cx="15" cy="44" rx="12" ry="24" fill="#FFEB3B"/>
    <g fill="#FFA000">
      <ellipse cx="10" cy="30" rx="2" ry="5"/>
      <ellipse cx="20" cy="36" rx="2" ry="5"/>
      <ellipse cx="14" cy="48" rx="2" ry="5"/>
      <ellipse cx="18" cy="56" rx="2" ry="4"/>
    </g>
    <path d="M -2 18 Q 8 6 20 16 L 16 24 Q 8 16 0 26 Z" fill="#27AE60"/>
    <path d="M 14 8 Q 28 14 22 30 L 14 26 Q 18 18 12 14 Z" fill="#2ECC71"/>
  </g>
  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="110" cy="90" rx="34" ry="22"/>
    <ellipse cx="140" cy="80" rx="28" ry="20"/>
    <ellipse cx="170" cy="92" rx="22" ry="16"/>
  </g>
  <!-- 文字: 星露小镇 -->
  <text x="256" y="500" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#2E7D32"/>
</svg>
