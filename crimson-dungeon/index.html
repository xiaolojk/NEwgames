<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>赤焰地牢 · Crimson Dungeon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    color: #eaeaea;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a1020 0%, #08060a 100%);
  }
  canvas { display: block; image-rendering: pixelated; }

  /* ============ HUD 层：默认不拦截鼠标/键盘事件 ============ */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* 顶部信息栏 */
  .top-bar {
    position: absolute;
    top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px;
  }
  .stat-panel {
    background: rgba(10,5,15,0.75);
    border: 1px solid #8040c0;
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 200px;
    backdrop-filter: blur(2px);
  }
  .stat-row {
    display: flex; align-items: center; gap: 8px;
    margin: 3px 0;
    font-size: 12px;
  }
  .stat-label { width: 36px; color: #c0a0e0; font-weight: bold; }
  .stat-bar {
    flex: 1; height: 10px;
    background: #20102a; border-radius: 5px; overflow: hidden;
    border: 1px solid #402060;
  }
  .stat-fill {
    height: 100%; transition: width 0.15s ease-out;
    border-radius: 4px;
  }
  .stat-fill.hp { background: linear-gradient(90deg,#ff4050,#ff8080); }
  .stat-fill.sp { background: linear-gradient(90deg,#40a0ff,#80c0ff); }
  .stat-fill.xp { background: linear-gradient(90deg,#ffc040,#ffe080); }
  .stat-text { font-size: 11px; color: #e0d0f0; min-width: 60px; text-align: right; }

  .info-panel {
    background: rgba(10,5,15,0.75);
    border: 1px solid #8040c0;
    border-radius: 6px;
    padding: 8px 12px;
    text-align: right;
    font-size: 13px;
    line-height: 1.6;
  }
  .info-panel .floor { color: #ff6060; font-size: 15px; font-weight: bold; }
  .info-panel .gold  { color: #ffc040; }
  .info-panel .kills { color: #c0e0ff; }
  .info-panel .time  { color: #a0c0a0; }

  /* 伤害飘字层 */
  .damage-layer {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .dmg-num {
    position: absolute;
    font-weight: 900;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    pointer-events: none;
    animation: dmgFloat 0.9s ease-out forwards;
  }
  .dmg-num.normal { color: #ffffff; font-size: 16px; }
  .dmg-num.crit   { color: #ffe040; font-size: 24px; transform: scale(1.3); }
  .dmg-num.player { color: #ff4040; font-size: 18px; }
  .dmg-num.heal   { color: #40ff80; font-size: 18px; }
  @keyframes dmgFloat {
    0%   { opacity: 0; transform: translate(-50%,0) scale(0.6); }
    15%  { opacity: 1; transform: translate(-50%,-10px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-60px) scale(0.9); }
  }

  /* Toast 提示 */
  .toast {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30,15,50,0.95);
    border: 1px solid #c060ff;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 14px;
    color: #ffe0ff;
    box-shadow: 0 2px 20px rgba(192,96,255,0.3);
    animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 1.7s forwards;
    pointer-events: none;
  }
  @keyframes toastIn  { from { opacity:0; transform: translate(-50%,-20px);} to{opacity:1;} }
  @keyframes toastOut { from { opacity:1;} to{opacity:0; transform: translate(-50%,-30px);} }

  /* ============ 模态框：默认隐藏，显示时才允许点击 ============ */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
  }
  .modal.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-box {
    background: linear-gradient(145deg, #1a0a2a, #0a0515);
    border: 2px solid #c060ff;
    border-radius: 10px;
    padding: 30px 40px;
    min-width: 420px;
    max-width: 90vw;
    box-shadow: 0 0 60px rgba(192,96,255,0.25);
  }
  .modal-title {
    font-size: 24px; font-weight: bold;
    text-align: center; margin-bottom: 18px;
    color: #ffc0ff;
    text-shadow: 0 0 20px rgba(255,120,255,0.5);
  }

  /* 升级选项 */
  .upgrade-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .upgrade-btn {
    pointer-events: auto;
    background: rgba(60,20,100,0.6);
    border: 2px solid #8040c0;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    color: #e0d0f0;
    transition: all 0.15s;
    text-align: left;
  }
  .upgrade-btn:hover {
    background: rgba(100,40,160,0.8);
    border-color: #c080ff;
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(192,128,255,0.3);
  }
  .upgrade-btn .up-name { font-size: 16px; font-weight: bold; color: #ffe080; margin-bottom: 4px; }
  .upgrade-btn .up-desc { font-size: 12px; color: #c0b0d0; }

  /* 死亡面板 */
  .death-title {
    font-size: 36px; font-weight: 900;
    color: #ff4050;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255,64,80,0.6);
  }
  .death-stats {
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    padding: 14px 18px;
    margin: 14px 0;
    font-size: 14px;
    line-height: 2;
  }
  .death-stats .label { color: #a090b0; display: inline-block; width: 90px; }
  .death-stats .val   { color: #ffe0a0; font-weight: bold; }
  .primary-btn {
    pointer-events: auto;
    display: block; width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: linear-gradient(145deg, #c04080, #802060);
    border: 2px solid #ff60a0;
    border-radius: 8px;
    color: white;
    font-size: 16px; font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  .primary-btn:hover {
    background: linear-gradient(145deg, #e05090, #a03070);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(255,96,160,0.4);
  }

  /* 控制提示 */
  .controls-hint {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(10,5,15,0.75);
    border: 1px solid #402060;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    color: #807090;
    line-height: 1.7;
  }
  .controls-hint b { color: #c0a0e0; }
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD DOM 层：默认 pointer-events: none，不拦截画布输入 -->
<div id="hud">
  <div class="top-bar">
    <div class="stat-panel" id="stats">
      <div class="stat-row"><span class="stat-label">HP</span>
        <div class="stat-bar"><div class="stat-fill hp" id="bar-hp" style="width:100%"></div></div>
        <span class="stat-text" id="txt-hp">100/100</span>
      </div>
      <div class="stat-row"><span class="stat-label">SP</span>
        <div class="stat-bar"><div class="stat-fill sp" id="bar-sp" style="width:100%"></div></div>
        <span class="stat-text" id="txt-sp">100/100</span>
      </div>
      <div class="stat-row"><span class="stat-label">LV</span>
        <span style="color:#ffe080;font-weight:bold;font-size:13px;" id="txt-lv">1</span>
        <div class="stat-bar" style="height:6px"><div class="stat-fill xp" id="bar-xp" style="width:0%"></div></div>
        <span class="stat-text" id="txt-xp">0/50</span>
      </div>
    </div>
    <div class="info-panel">
      <div><span class="floor" id="txt-floor">第 1 层</span></div>
      <div><span class="gold" id="txt-gold">🪙 0</span></div>
      <div><span class="kills" id="txt-kills">💀 0</span></div>
      <div><span class="time" id="txt-time">⏱ 00:00</span></div>
    </div>
  </div>

  <div class="damage-layer" id="damage-layer"></div>

  <div class="controls-hint">
    <div><b>WASD</b> 移动　<b>鼠标/方向</b> 瞄准</div>
    <div><b>左键/J</b> 攻击　<b>空格</b> 闪避冲刺</div>
    <div><b>1~5</b> 使用道具　<b>E</b> 商店</div>
  </div>
</div>

<!-- 升级面板 -->
<div class="modal" id="upgrade-modal">
  <div class="modal-box">
    <div class="modal-title">✨ 升级！选择一项强化 ✨</div>
    <div class="upgrade-list" id="upgrade-list"></div>
  </div>
</div>

<!-- 死亡面板 -->
<div class="modal" id="death-modal">
  <div class="modal-box">
    <div class="death-title">你倒下了…</div>
    <div class="death-stats" id="death-stats"></div>
    <button class="primary-btn" id="btn-restart">⚔ 重新挑战</button>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
